name: "tools: check release"

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check and tag new release
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Check and tag new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(curl -s 'http://dl.google.com/android/cli/latest/debian/dists/stable/main/binary-amd64/Packages' | grep -oP '^Version: \K.*')
          if ! git ls-remote --exit-code origin "refs/tags/tools-$latest"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "tools-$latest" -m "tools-$latest"
            git push origin "tools-$latest"
            gh workflow run release.yaml -f tier=tools -f version="$latest"
          fi
